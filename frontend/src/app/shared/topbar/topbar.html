<header class="w-full bg-white/90 backdrop-blur-md border-b border-stone-200/80 sticky top-0 z-50 shadow-xs">
<div class="px-4 py-3 flex justify-between items-center border-b border-stone-200">
    <div routerLink="/dashboard" class="flex items-end gap-1.5 cursor-pointer">
        <span class="text-xl font-bold tracking-tight text-main-text">Wandr</span>
        <span class="w-1.5 h-1.5 rounded-full bg-secondary inline-block mb-1.5"></span>
    </div>

    <div class="flex gap-4 items-center">
        <button class="text-stone-500 cursor-pointer">
            <span class="material-symbols-outlined !text-xl">notifications</span>
        </button>

        <div class="w-px h-6 bg-stone-200"></div>

        <div class="relative">
            <div (click)="toggleMenu()" class="flex items-center gap-2 cursor-pointer group select-none">
                <p class="text-sm text-main-text group-hover:cursor-pointer">{{ fullName() }}</p>
                <div class="bg-stone-400 rounded-full py-1.5 px-1.5 items-center hover:bg-stone-500 cursor-pointer">
                    <p class="text-white text-xs">{{ initials() }}</p>
                </div>
            </div>

            @if (isMenuOpen()) {
                <div class="absolute right-0 mt-2 w-28 bg-white rounded-md shadow-lg py-1 border border-stone-200 z-50">
                <button (click)="logout()" class="px-4 py-2 text-sm text-main-text flex items-center gap-2 cursor-pointer">
                    <span class="material-symbols-outlined !text-sm text-accent">logout</span>Log out
                </button>
            </div>
            }
      </div>

        
    </div>
</div>
</header>
