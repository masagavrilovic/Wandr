<div class="relative min-h-screen w-full overflow-hidden text-white">

  <img src="cinque-terre.webp" class="absolute inset-0 h-full w-full object-cover">
  <div class="absolute inset-0 bg-gradient-to-r from-black/60 via-black/40 to-black/30"></div>

  <div class="relative z-10 flex min-h-screen flex-col justify-between px-6 py-6 md:px-16 lg:px-24">
    <header class="flex items-center justify-between">
      <div class="text-3xl font-bold">Wandr</div>

      <div class="flex items-center space-x-6">
        <button [routerLink]="['/login']" class="text-sm text-gray-200 hover:text-accent cursor-pointer">Log in</button>
        <button [routerLink]="['/register']" class="text-sm text-gray-200 hover:text-accent cursor-pointer">Register</button>
      </div>
    </header>

    <main class="my-auto max-w-2xl py-12">
      <h1 class="mb-5 text-5xl font-extrabold leading-tight tracking-tight sm:text-6xl lg:text-7xl">A place for all<br/><span class="text-secondary">your adventures</span></h1>

      <p class="text-lg text-gray-100 sm:text-xl font-medium">Effortlessly plan your next adventure — solo or with a group.</p>

      <div class="mt-2 flex flex-wrap items-center gap-x-3 text-sm font-medium text-gray-300">
        <span class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-secondary"></span>Day-by-day itinerary</span>
        <span class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-secondary"></span>Vote on activities</span>
        <span class="flex items-center gap-1.5"><span class="h-1.5 w-1.5 rounded-full bg-secondary"></span>Split expenses</span>
      </div>

      <button class="mt-6 rounded-full bg-accent px-8 py-3 text-sm font-semibold hover:bg-accent-hover">Start planning</button>
    </main>
  </div>
</div>
