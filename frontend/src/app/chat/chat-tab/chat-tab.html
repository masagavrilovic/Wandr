@let currentUserId = currentUserId$ | async;
@let messages = messages$ | async;

@if (error()) {
  <div class="w-full px-4">
    <p class="mb-3 rounded-lg bg-red-500/10 px-3 py-2 text-sm text-accent">{{ error() }}</p>
  </div>
}

<div class="grid grid-cols-1 lg:grid-cols-5 gap-4 w-full items-start">
  <section class="lg:col-span-4 min-w-0 flex flex-col bg-surface rounded-xl shadow-md overflow-hidden h-[70vh] min-h-[420px]">
    <app-message-list
      class="flex-1 min-h-0 flex flex-col"
      [messages]="messages ?? []"
      [currentUserId]="currentUserId"
      (loadOlder)="loadOlder()"
      (edit)="startEdit($event)"
      (remove)="remove($event)" />

    <form class="flex w-full items-center gap-2 px-4 py-3 bg-surface" (ngSubmit)="send()">
      <div class="relative flex-1 min-w-0 flex items-center justify-between rounded-full border border-neutral-200 bg-background transition-all focus-within:border-primary focus-within:bg-white focus-within:ring-3 focus-within:ring-primary/10">
        <button
          (click)="toggleEmojiPicker()"
          type="button"
          class="absolute left-2 p-1.5 text-note-text hover:text-main-text cursor-pointer flex items-center justify-center">
          <span class="material-symbols-outlined">sentiment_satisfied</span>
        </button>

        <input
          type="text"
          name="draft"
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
          maxlength="2000"
          autocomplete="off"
          placeholder="Type a message..."
          class="w-full flex-1 min-w-0 bg-transparent py-2.5 pl-11 pr-10 text-sm outline-none border-none focus:ring-0"
        />

        @if (editing) {
          <button type="button" class="text-note-text/60 flex items-center justify-center p-1 cursor-pointer" (click)="cancelEdit()">
            <span class="material-symbols-outlined">close</span>
          </button>
        }

        @if (showEmojiPicker()) {
          <div class="fixed inset-0 z-40" (click)="showEmojiPicker.set(false)"></div>
          <div class="absolute bottom-14 left-0 z-50 shadow-2xl rounded-2xl overflow-hidden">
            <emoji-mart
              (emojiSelect)="addEmoji($event)"
              [darkMode]="false"
              [set]="'apple'">
            </emoji-mart>
          </div>
        }
      </div>

      <button
        type="submit"
        [disabled]="!draft().trim()"
        aria-label="Send message"
        class="flex items-center justify-center gap-1.5 cursor-pointer rounded-full bg-tertiary px-5 py-2.5 text-sm font-medium text-white transition-all hover:opacity-90 active:scale-98 disabled:cursor-not-allowed disabled:opacity-50">
        {{ editing ? 'Save' : 'Send' }}
      </button>
    </form>
  </section>

  <app-sidebar class="block lg:col-span-1 min-w-0 lg:sticky lg:top-4 shadow-sm rounded-xl" />
</div>
