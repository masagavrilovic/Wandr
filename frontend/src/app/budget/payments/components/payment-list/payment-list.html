<div class="mt-10">
    <div class="flex justify-between items-center border-b-2 border-stone-200 pb-2">
        <h2 class="font-semibold text-main-text uppercase">Payment tracker</h2>
        <div class="flex flex-inline items-center gap-4">
            <button (click)="openCreateModal()" class="flex items-center justify-center rounded-full bg-tertiary hover:bg-tertiary-hover text-white px-1 shadow-md cursor-pointer">
            <span class="material-symbols-outlined !text-lg">add</span>
            </button>
        </div>
    </div>
    <div (scroll)="onScroll($event)" class="max-h-[40vh] overflow-y-auto pr-2 mt-4">
        @for (payment of payments$ | async; track payment.id) {
            <app-payment-item [payment]="payment"></app-payment-item>
        }
    </div>
</div>

@if (showCreateModal()) {
  <app-create-update-payment
  [tripId]="tripId"
  [baseCurrency]="baseCurrency"
  (closed)="closeCreateModal()">
  </app-create-update-payment>
}
