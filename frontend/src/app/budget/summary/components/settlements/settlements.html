<div>
  <h2 class="text-sub-text text-sm font-semibold uppercase mt-8 mb-4">Debts</h2>
  @for (s of (settlements$ | async)?.transactions; track $index) {
    <div class="bg-background hover:shadow-md my-1.5 rounded-lg px-3 py-2 flex items-center justify-between gap-2">
      <div>
        <div class="flex items-center gap-1 text-xs text-main-text font-medium">
          <span class="text-primary">{{ s.from.firstName }} {{ s.from.lastName }}</span>
          <span class="material-symbols-outlined !text-xs text-sub-text">arrow_right_alt</span>
          <span class="text-primary">{{ s.to.firstName }} {{ s.to.lastName }}</span>
        </div>
        
        <p class="text-[11px] text-sub-text mt-0.5">
          Owes: <span class="font-semibold text-main-text text-xs">{{ s.amount }} {{ baseCurrency }}</span>
        </p>
      </div>

      <button (click)="openCreatePayment()" class="shrink-0 px-2 py-1 rounded-md bg-primary/10 text-primary hover:bg-primary hover:text-white text-[11px] font-medium transition-colors cursor-pointer">
        Log
      </button>

    </div>
  }
</div>
