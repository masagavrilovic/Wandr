@if (view$ | async; as view) {
  @if (view.slices.length > 0) {
    <div class="bg-background rounded-xl shadow-md p-4">
      <h2 class="text-sub-text text-sm font-semibold uppercase mb-4">Spending by category</h2>
      <div class="flex justify-center items-center gap-6">
        <div class="relative h-46 w-46 shrink-0 sm:h-44 sm:w-44 mb-12">
          <canvas baseChart type="doughnut" [data]="view.data" [options]="view.options"></canvas>

          <div class="pointer-events-none absolute inset-0 flex flex-col items-center justify-center px-12 text-center">
            <span class="text-base font-semibold text-main-text sm:text-sm">{{ view.total }}</span>
            <span class="text-xs text-sub-text">Total ({{ baseCurrency }})</span>
          </div>
        </div>
      </div>

      <div>
          <ul class="space-y-2">
            @for (slice of view.slices; track slice.category) {
              <li class="flex items-center gap-3 text-sm">
                <span class="h-3 w-3 shrink-0 rounded-full" [style.background-color]="slice.color"></span>
                <span class="flex-1 truncate text-main-text">{{ slice.category }}</span>
                <span class="text-main-text">{{ slice.amount }} {{ baseCurrency }}</span>
                <span class="w-14 text-right text-sub-text">{{ slice.percentLabel }}</span>
              </li>
            }
          </ul>
        </div>
    </div>
  }
}
