<div class="rounded-3xl bg-background p-5 shadow-sm border border-surface flex flex-col gap-4 text-main-text my-2">
    <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4">
            <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-surface-hover shrink-0">
                <p class="material-symbols-outlined !text-2xl" [style.color]="meta.color">{{ meta.icon }}</p>
            </div>

            <div class="flex flex-col gap-1">
                <h4 class="text-base font-bold text-main-text m-0">{{ expense.description }}</h4>
                <div class="flex items-center flex-wrap gap-1 text-xs text-sub-text">
                    <span>{{ expense.paidAt | date:'dd.MM' }}</span>
                    <span>|</span>
                    <span>Paid by: <strong class="text-main-text font-semibold">Test User</strong></span>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-end shrink-0">
            <span class="text-xl font-extrabold text-main-text">{{ expense.amount }}  {{ expense.currency }}</span>
            <span class="text-xs text-sub-text">= {{ expense.baseAmount }} {{ expense.baseCurrency }}</span>
        </div>

        <button (click)="openEditModal()" class="cursor-pointer text-stone-500 hover:text-stone-700">
          <span class="material-symbols-outlined !text-lg">edit</span>
        </button>
    </div>
</div>

@if (showEditModal()) {
    <app-create-update-expense [tripId]="tripId" [expense]="expense" [baseCurrency]="expense.baseCurrency" (closed)="closeEditModal()"/>
}
