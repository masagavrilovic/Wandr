@let isSaving = isSaving$ | async;
@let error = error$ | async;

<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
    
    <div class="flex gap-4 justify-between items-center py-2 px-1">
      <div class="flex items-center gap-4">
        <span class="inline-flex items-center px-2 py-2 rounded-xl text-xs font-semibold shrink-0 bg-primary/15 text-primary">
          <span class="material-symbols-outlined">luggage</span>
        </span>
        <h2 class="text-xl font-semibold text-primary">{{ isEditMode ? 'Edit packing item' : 'Add packing item' }}</h2>
      </div>
      @if (isEditMode) {
        <button
        type="button"
        (click)="openDeleteModal()"
        class="hover:text-accent rounded-full cursor-pointer">
        <span class="material-symbols-outlined !text-2xl text-sub-text/50 hover:text-accent">delete</span>
      </button>
      }
      
    </div>

    <form [formGroup]="itemForm" class="space-y-4 mt-5">
      <div>
        <label for="itemText" class="block text-xs uppercase tracking-wider text-main-text mb-1">
          Item Name <span class="text-accent">*</span>
        </label>
        <input 
          type="text" 
          id="itemText" 
          name="text" 
          formControlName="text"
          placeholder="ex. Passport, Powerbank, Tent..." 
          class="w-full bg-transparent rounded-xl border border-stone-200 py-2.5 pl-2 text-sm text-main-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/15 transition-colors"
          required 
        />
        @if (itemForm.get('text')?.touched && itemForm.get('text')?.invalid) {
          <p class="text-xs text-accent mt-1">Text is required.</p>
        }
      </div>

      <div>
        <label for="typeText" class="block text-xs uppercase tracking-wider text-main-text mb-1">List type</label>
        <select 
            id="listCategory" 
            name="type" 
            formControlName="type"
            class="w-full bg-transparent rounded-xl border border-stone-200 py-2.5 pl-2 text-sm text-main-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/15 transition-colors cursor-pointer"
          >
            @for(t of types; track t) {
              <option [value]="t">{{ t }}</option>
            }
          </select>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider text-main-text mb-1">Category</label>
        <select 
            id="itemCategory" 
            name="category" 
            formControlName="category"
            class="w-full bg-transparent rounded-xl border border-stone-200 py-2.5 pl-2 text-sm text-main-text outline-none focus:border-primary focus:ring-2 focus:ring-primary/15 transition-colors cursor-pointer"
          >
            @for(cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
      </div>

      @if (error) {
        <div class="mb-4 mt-2 p-3 bg-surface text-accent rounded-lg text-sm border border-accent">
          {{ error }}
        </div>
      }

      <div class="flex items-center justify-end gap-3 pt-4 mt-6">
        <button 
          type="button" 
          (click)="close(isSaving)"
          [disabled]="isSaving"
          class="cursor-pointer bg-surface rounded-lg px-6 py-2.5 text-sm shadow-sm transition hover:bg-surface-hover disabled:cursor-not-allowed disabled:opacity-50">
          Cancel
        </button>
        <button 
          type="submit" 
          (click)="onSubmit()"
          [disabled]="isSaving"
          class="flex items-center gap-2 bg-tertiary text-white rounded-xl py-2.5 px-6 font-medium hover:bg-tertiary-hover disabled:opacity-50 disabled:cursor-not-allowed transition text-sm shadow-md shadow-accent/20 cursor-pointer"
        >
          {{ isSaving ? 'Processing...' : 'Save' }}
        </button>
      </div>

    </form>
  </div>
</div>
