<div class="group flex items-center justify-between bg-surface text-sm px-2 py-2 transition-colors hover:bg-surface-hover">
  <div class="flex items-center gap-4">
  <input
      type="checkbox"
      [checked]="item.assignedTo"
      (change)="onCheckboxChange($event)"
      class="peer h-5 w-5 rounded border-sub-text/40 text-tertiary focus:ring-tertiary disabled:cursor-not-allowed disabled:opacity-50"
  />
  <span class="text-main-text peer-checked:line-through">{{ item.text }}</span>
  </div>

  <div class="flex flex-row gap-2">
    <button (click)="openDeleteModal()" type="button" class="hidden rounded-full text-sub-text transition-colors hover:bg-surface-hover hover:text-accent group-hover:block cursor-pointer">
      <span class="material-symbols-outlined text-accent !text-lg">delete</span>
    </button>
    <button (click)="openEditModal()" class="hidden rounded-full text-stone-500 transition-colors hover:bg-surface-hover hover:text-stone-700 group-hover:block cursor-pointer">
      <span class="material-symbols-outlined !text-lg">edit</span>
    </button>
  </div>

</div>

@if (showDeleteModal()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="bg-background rounded-2xl p-6 max-w-sm mx-4 shadow-xl">
      <h3 class="text-lg font-bold text-primary mb-2">Permanent Action</h3>
      <p class="text-sm text-main-text mb-4">Are you sure you want to delete this item?</p>

      <div class="flex justify-end gap-3">
        <button
          (click)="closeDeleteModal()"
          class="px-4 py-2 text-sm text-main-text hover:bg-surface-hover rounded-xl cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          Cancel
        </button>
        <button
          (click)="confirmDelete()"
          class="px-4 py-2 text-sm bg-accent text-white hover:bg-accent-hover rounded-xl cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
          Confirm
        </button>
      </div>
    </div>
  </div>
}

@if(showEditModal()) {
  <app-create-update-item [item]="this.item" [tripId]="this.tripId" (closed)="closeEditModal()" />
}
