<div (click)="openEditModal()" class="group flex items-center justify-between bg-surface text-sm px-2 py-2 transition-colors hover:bg-surface-hover cursor-pointer">
  <div class="flex items-center gap-4">
  <input
      type="checkbox"
      [checked]="item.assignedTo"
      (change)="onCheckboxChange($event)"
      (click)="$event.stopPropagation()"
      class="h-4 w-4 accent-primary shrink-0 rounded border-sub-text/40 text-tertiary focus:ring-tertiary cursor-pointer disabled:cursor-not-allowed disabled:opacity-50"
  />
  <span class="text-main-text">{{ item.text }}</span>
  @if (item.assignedTo && item.listType === packingListEnum.SHARED) {
    <span class="inline-flex items-center gap-1.5 rounded-full bg-surface-hover px-2.5 py-1 text-xs text-primary whitespace-nowrap shrink-0 mr-5">
        <span class="h-1.5 w-1.5 rounded-full bg-primary/60"></span>
        {{ item.assignedTo.firstName + ' ' + item.assignedTo.lastName }}
      </span>
  }
  </div>
</div>



@if(showEditModal()) {
  <app-create-update-item [item]="this.item" [tripId]="this.tripId" (closed)="closeEditModal()" />
}
