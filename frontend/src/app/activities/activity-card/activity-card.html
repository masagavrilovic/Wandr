<div (click)="openEditModal()" class="rounded-3xl bg-surface p-5 shadow-sm border border-surface flex items-center gap-5 my-2 transition-all hover:shadow-md hover:bg-surface-hover cursor-pointer">
  <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-primary/10 shrink-0">
    <p class="material-symbols-outlined !text-2xl text-primary">{{ meta.icon }}</p>
  </div>
  
  <div class="w-[1px] bg-primary/20 self-stretch"></div>

  <div class="flex flex-col flex-1">
    <div class="flex items-center justify-between gap-3 w-full">
      <h4 class="text-primary text-sm font-semibold">{{ activity.name }}</h4>
      <span 
        class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold shrink-0"
        [style.background-color]="meta.color + '15'" 
        [style.color]="meta.color">
        {{ activity.category }}
      </span>
    </div>

    <div class="flex items-center gap-2 text-xs text-sub-text flex-wrap min-w-0">
      @if (activity.address) {
        <span class="flex gap-0.5 items-center text-sm text-sub-text">
          <span class="material-symbols-outlined !text-base shrink-0">location_on</span>
          <span class="truncate">{{ activity.address }}</span>
        </span>
      }

      @if (activity.time) {
        <span class="flex gap-0.5 items-center text-sm text-sub-text">
          <span class="material-symbols-outlined !text-base">schedule</span>
          {{ activity.time | slice:0:5 }}
        </span>
      }
    </div>

    @if (activity.notes) {
      <p class="flex gap-0.5 items-start text-sm text-sub-text">
      <span class="material-symbols-outlined !text-sm">notes</span>
      {{ activity.notes }}
    </p>
    }
    
  </div>
</div>

@if(showEditModal()) {
  <app-create-update-activity [activity]="activity" (closed)="closeEditModal()" />
}
