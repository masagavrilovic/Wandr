<div class="w-full px-4 sm:px-2 py-2 mb-5">
    <div class="grid grid-cols-1 md:grid-cols-10 items-start gap-6">
        <div class="col-span-1 md:col-span-6 h-[500px] overflow-y-auto pr-5">
            <div class="flex justify-between items-center">
                <h2 class="font-semibold text-main-text mb-4 uppercase">Activities </h2>
                <button (click)="openCreateModal()" class="flex items-center justify-center rounded-full bg-primary hover:bg-primary-hover text-white px-1 py-1 shadow-md cursor-pointer">
                  <span class="material-symbols-outlined">add</span>
                </button>
              </div>
              
              <app-activity-card-list [tripId]="tripId"></app-activity-card-list>
        </div>

        <div class="col-span-1 md:col-span-4 md:sticky md:top-6 h-[500px]">
            <app-map></app-map>
        </div>

    </div>
</div>

@if (showCreate()) {
  <app-create-update-activity [tripId]="tripId" (closed)="closeCreateModal()" />
}
